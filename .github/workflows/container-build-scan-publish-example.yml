name: Example Container Build, Scan & Publish

on:
  push:
    branches: [main]
    paths:
      - "examples/Dockerfile.container-build-scan-publish"
      - ".github/workflows/container-build-scan-publish-example.yml"
      - ".github/workflows/container-build-scan-publish.yml"
  workflow_dispatch:

jobs:
  build-scan-publish-example:
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    uses: brgsstm/pipeline-templates/.github/workflows/container-build-scan-publish.yml@main
    with:
      image-name: example-app
      dockerfile-path: "examples/Dockerfile.container-build-scan-publish"
      build-context: "."
      acr-registry: "tab284526.azurecr.io"
      trivy-severity: "CRITICAL,HIGH"
      fail-on-vulnerabilities: true
      build-args: '{"ENV":"development"}'
    secrets:
      client-id: ${{ secrets.MI_CLIENT_ID }}
      tenant-id: ${{ secrets.ENTRA_TENANT_ID }}
      subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
