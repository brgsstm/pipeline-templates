name: Build and Publish Function App Artifact

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-publish-function-artifact:
    permissions:
      actions: read
      contents: read
      id-token: write
    
    uses: brgsstm/pipeline-templates/.github/workflows/function-app-package-publish.yml@develop
    with:
      function-app-name: example-function-app
      storage-account-name: iaccoresharedstgem22
      storage-container-name: func-packages
      storage-resource-group: shared-storage
      python-version: "3.13"
      source-path: "examples/function-app-package-publish"
      requirements-path: "examples/function-app-package-publish/requirements.txt"
    secrets:
      client-id: ${{ secrets.MI_CLIENT_ID }}
      tenant-id: ${{ secrets.ENTRA_TENANT_ID }}
      subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

